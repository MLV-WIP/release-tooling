# Reusable: run semantic-release for the calling repository.
name: semantic-release (reusable)

on:
  workflow_call:
    inputs:
      verified-sha:
        description: Commit SHA that passed consumer CI (checked out as main)
        type: string
        required: true
      prepare-command:
        description: >
          Shell for @semantic-release/exec prepareCmd. Use a literal
          ${nextRelease.version} placeholder (expanded by semantic-release).
        type: string
        required: false
        default: ""
      git-assets:
        description: Comma-separated paths for @semantic-release/git to commit
        type: string
        required: false
        default: ""
      tooling-ref:
        description: Ref of MLV-WIP/release-tooling to install from
        type: string
        required: false
        default: v1.1.0
      github-app-environment:
        description: >
          Caller-repo Environment that holds RELEASE_APP_CLIENT_ID (var) and
          RELEASE_APP_PRIVATE_KEY (secret). Required so pushes can use a
          ruleset-bypass GitHub App instead of GITHUB_TOKEN.
        type: string
        required: false
        default: mlv-release-bot-env

permissions:
  contents: read

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-app-environment }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN / github-actions[bot] cannot bypass branch rulesets.
      # Mint an installation token for the caller's release App (on Bypass list).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync to CI-verified main tip
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main "${{ inputs.verified-sha }}"

      - name: Checkout release-tooling
        uses: actions/checkout@v4
        with:
          repository: MLV-WIP/release-tooling
          ref: ${{ inputs.tooling-ref }}
          path: .release-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: .release-tooling/package-lock.json

      - name: Install tooling
        working-directory: .release-tooling
        run: |
          if [[ -f package-lock.json ]]; then
            npm clean-install
          else
            npm install
          fi

      - name: Release
        env:
          # Same env var name semantic-release expects; value is the App token.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
          RELEASE_PREPARE_CMD: ${{ inputs.prepare-command }}
          RELEASE_GIT_ASSETS: ${{ inputs.git-assets }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.release-tooling/node_modules/.bin:$PATH"
          # Run from consumer root so git ops apply to the project; load config from tooling.
          cp .release-tooling/release.config.cjs ./release.config.cjs
          semantic-release
          rm -f ./release.config.cjs
